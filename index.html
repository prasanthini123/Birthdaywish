<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday — CADPOINT Kumbakonam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060f;--gold:#e8c373;--gold2:#fff1c9;--red:#ee2024;--text:#f4f1ea;--muted:#a9adc4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% 120%,#1b1442 0,#0a0b1f 45%,var(--bg) 80%);color:var(--text);font-family:'Inter',system-ui,sans-serif;overflow:hidden;position:relative}
.stars{position:fixed;inset:0;background-image:radial-gradient(1.2px 1.2px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 28% 60%,#cfd6ff,transparent),radial-gradient(1.4px 1.4px at 46% 12%,#fff,transparent),radial-gradient(1px 1px at 63% 38%,#ffe9b8,transparent),radial-gradient(1.3px 1.3px at 78% 16%,#fff,transparent),radial-gradient(1px 1px at 90% 52%,#cfd6ff,transparent),radial-gradient(1px 1px at 8% 82%,#fff,transparent),radial-gradient(1.2px 1.2px at 55% 78%,#fff,transparent),radial-gradient(1px 1px at 35% 34%,#fff,transparent),radial-gradient(1px 1px at 95% 88%,#fff,transparent);animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.45}to{opacity:1}}
#fx{position:fixed;inset:0;z-index:1}
.spot{position:fixed;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;background:radial-gradient(circle,rgba(232,195,115,.14),transparent 65%);z-index:2;pointer-events:none;left:50%;top:45%;transition:left .25s ease-out,top .25s ease-out}
.vig{position:fixed;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.55) 100%)}
.stage{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 22px;transition:transform .3s ease-out}
.logo{height:clamp(64px,15vh,130px);width:auto;max-width:78vw;display:block;opacity:0;filter:drop-shadow(0 4px 24px rgba(238,32,36,.25));animation:fade 1.2s ease .2s forwards}
.rule{width:0;height:1px;margin:18px 0 16px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:grow 1.4s cubic-bezier(.6,0,.2,1) .6s forwards}
@keyframes grow{to{width:min(360px,70vw)}}
@keyframes fade{to{opacity:1}}
.eyebrow{font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:500;opacity:0;animation:fade 1s ease 1.1s forwards;margin:0 0 6px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;margin:6px 0 4px;line-height:.98;font-size:clamp(46px,min(12vw,14vh),124px);letter-spacing:-.01em}
h1 .ln{display:block}
h1 .w{display:inline-block;white-space:nowrap}
h1 .c{display:inline-block;opacity:0;transform:translateY(.55em) rotateX(-70deg);filter:blur(14px);animation:ch .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(1.3s + var(--i)*.055s);transform-origin:50% 100%}
@keyframes ch{to{opacity:1;transform:none;filter:blur(0)}}
h1 .ln2{font-style:italic;color:var(--gold)}
h1 .ln2 .c{color:var(--gold2);text-shadow:0 0 30px rgba(232,195,115,.45)}
.ln2{animation:glow 3.5s ease-in-out 3.2s infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 rgba(232,195,115,0))}to{filter:drop-shadow(0 0 18px rgba(232,195,115,.55))}}
.sub{font-family:'Cormorant Garamond',serif;font-size:clamp(21px,3.6vw,30px);font-weight:600;margin:18px 0 10px;opacity:0;transform:translateY(14px);animation:up .9s ease 2.7s forwards}
.msg{max-width:540px;font-weight:300;font-size:clamp(14.5px,2.2vw,17px);line-height:1.85;color:var(--muted);margin:0;opacity:0;transform:translateY(14px);animation:up .9s ease 3s forwards}
@keyframes up{to{opacity:1;transform:none}}
.sig{margin-top:30px;opacity:0;animation:fade 1s ease 3.4s forwards}
.sig span{display:block;font-size:11px;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
.sig b{display:inline-block;margin-top:8px;font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;letter-spacing:.05em;color:#fff;padding-bottom:8px;position:relative}
.sig b::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--red);animation:ul 1s ease 3.9s forwards}
@keyframes ul{to{width:100%}}
.foot{position:fixed;z-index:3;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;color:#6f7491;opacity:0;animation:fade 1s ease 4.2s forwards}
.corner{position:fixed;z-index:3;width:46px;height:46px;border:1px solid rgba(232,195,115,.45);opacity:0;animation:fade 1.5s ease 1s forwards}
.tl{top:calc(16px + env(safe-area-inset-top,0px));left:16px;border-right:0;border-bottom:0}.tr{top:calc(16px + env(safe-area-inset-top,0px));right:16px;border-left:0;border-bottom:0}.bl{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:16px;border-right:0;border-top:0}.br{bottom:calc(16px + env(safe-area-inset-bottom,0px));right:16px;border-left:0;border-top:0}
@media(max-height:640px){.logo{height:56px}.rule{margin:14px 0}.sig{margin-top:18px}.foot{display:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>

 <p class="eyebrow">Dear CADPOINT Student</p>
 <h1 aria-label="Happy Birthday!"><span class="ln" id="l1"></span><span class="ln ln2" id="l2"></span></h1>
 <p class="sub">Wishing you success and smiles!</p>

<div class="foot">Authorized Training Centre · ISO 9001 : 2008</div>
<script>
/* split title into animated letters */
let n=0;
function split(id,txt){const el=document.getElementById(id);txt.split(" ").forEach((w,wi,a)=>{const s=document.createElement("span");s.className="w";[...w].forEach(ch=>{const c=document.createElement("span");c.className="c";c.style.setProperty("--i",n++);c.textContent=ch;s.appendChild(c)});el.appendChild(s);if(wi<a.length-1)el.appendChild(document.createTextNode(" "))})}
split("l1","Happy");split("l2","Birthday!");
/* parallax + spotlight */
const st=document.getElementById("stage"),sp=document.getElementById("spot");
addEventListener("pointermove",e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;st.style.transform=`translate(${x*-14}px,${y*-10}px)`;sp.style.left=e.clientX+"px";sp.style.top=e.clientY+"px"});
/* fireworks */
const cv=document.getElementById("fx"),cx=cv.getContext("2d");let W,H,R=[],S=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}size();addEventListener("resize",size);
const COL=[[232,195,115],[255,90,90],[255,255,255],[120,200,255],[190,140,255],[255,150,60]];
function launch(x){R.push({x:x??(W*(.12+Math.random()*.76)),y:H+10,vx:(Math.random()-.5)*1.6,vy:-(Math.random()*5+10.5)*(H/800+.35),t:H*(.12+Math.random()*.32),c:COL[Math.random()*COL.length|0]})}
function explode(r){
  const n=90+Math.random()*50|0,ring=Math.random()<.4,c2=COL[Math.random()*COL.length|0];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.1,sp=ring?5.2:Math.random()*6+1.5;
    S.push({x:r.x,y:r.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.011+Math.random()*.012,c:i%5===0?c2:r.c})}
}
function frame(){
  cx.globalCompositeOperation="destination-out";cx.fillStyle="rgba(0,0,0,.2)";cx.fillRect(0,0,W,H);
  cx.globalCompositeOperation="lighter";
  R=R.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=.12;
    cx.fillStyle=`rgb(${r.c})`;cx.beginPath();cx.arc(r.x,r.y,2,0,6.3);cx.fill();
    if(r.y<=r.t||r.vy>-1){explode(r);return false}return true});
  S=S.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.vx*=.982;p.vy*=.982;p.l-=p.d;
    if(p.l<=0)return false;
    cx.fillStyle=`rgba(${p.c},${p.l})`;cx.beginPath();cx.arc(p.x,p.y,1.7*p.l+.4,0,6.3);cx.fill();return true});
  requestAnimationFrame(frame);
}
frame();
/* opening volley, then continuous show */
[0,350,700,1050].forEach((t,i)=>setTimeout(()=>launch(W*(.15+i*.23)),t+300));
setInterval(()=>{launch();if(Math.random()<.4)setTimeout(launch,250)},1400);
addEventListener("pointerdown",e=>launch(e.clientX));
</script>
